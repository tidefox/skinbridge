name: build

on:
  push:
    branches: ['**']
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  FORGE_VERSION: 1.12.2-14.23.5.2860
  FERMIUM_VERSION: 1.4.1

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      fermium_file_id: ${{ steps.fermium.outputs.id }}
    steps:
      - uses: actions/checkout@v4

      # Java 8 is the compile/test toolchain; Gradle itself runs on 21 (last one listed = JAVA_HOME).
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            21

      # Caches ~/.gradle, which includes RetroFuturaGradle's decompiled Minecraft/Forge and assets.
      - uses: gradle/actions/setup-gradle@v4

      - name: Resolve FermiumBooter file id
        id: fermium
        run: |
          id=$(grep -E '^fermium_file_id=' gradle.properties | cut -d= -f2 | tr -d '[:space:]')
          if [ -z "$id" ] || [ "$id" = "FIXME" ]; then
            echo "fermium_file_id not pinned; looking up FermiumBooter $FERMIUM_VERSION on CurseForge"
            id=$(python3 ci/find-fermium-id.py "$FERMIUM_VERSION")
          fi
          echo "FermiumBooter $FERMIUM_VERSION = CurseForge file $id"
          echo "id=$id" >> "$GITHUB_OUTPUT"

      - name: Build and test
        run: >
          ./gradlew build --stacktrace
          -Pfermium_file_id=${{ steps.fermium.outputs.id }}
          -Porg.gradle.java.installations.fromEnv=JAVA_HOME_8_X64

      - name: Pick release jar
        run: |
          ls -la build/libs
          mkdir -p dist
          jar=$(ls build/libs/pelt-*.jar | grep -vE -- '-(dev|sources|javadoc)\.jar$' | head -1)
          [ -n "$jar" ] || { echo "::error::no release jar"; exit 1; }
          cp "$jar" dist/
          echo "--- manifest"; unzip -p "$jar" META-INF/MANIFEST.MF
          echo "--- contents"; unzip -l "$jar"
          unzip -l "$jar" | grep -q 'mixins.pelt.json'         || { echo "::error::mixin config missing"; exit 1; }
          unzip -l "$jar" | grep -q 'mixins.pelt.refmap.json'  || { echo "::error::refmap missing"; exit 1; }
          unzip -p "$jar" META-INF/MANIFEST.MF | grep -q 'FMLCorePlugin: pelt.core.PeltLoadingPlugin' || { echo "::error::FMLCorePlugin missing"; exit 1; }
          echo "--- refmap"; unzip -p "$jar" mixins.pelt.refmap.json
          if unzip -l "$jar" | grep -qE 'org/spongepowered|fermiumbooter/'; then echo "::error::jar must not bundle Mixin/FermiumBooter"; exit 1; fi

      - uses: actions/upload-artifact@v4
        with:
          name: pelt-jar
          path: dist/*.jar
          if-no-files-found: error

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: test-reports
          path: build/reports/

  smoke:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 8

      - name: Cache Forge server install
        id: cache-forge
        uses: actions/cache@v4
        with:
          path: smoke/server
          key: forge-server-${{ env.FORGE_VERSION }}-v1

      - name: Install Forge server
        if: steps.cache-forge.outputs.cache-hit != 'true'
        run: |
          mkdir -p smoke/server && cd smoke/server
          curl -fsSL --retry 4 -o installer.jar \
            "https://maven.minecraftforge.net/net/minecraftforge/forge/${FORGE_VERSION}/forge-${FORGE_VERSION}-installer.jar"
          # vanilla server jar (the old installer's download URL is not always reachable)
          curl -fsSL --retry 4 -o minecraft_server.1.12.2.jar \
            "https://launcher.mojang.com/v1/objects/886945bfb2b978778c3a0288fd7fab09d315b25f/server.jar"
          java -jar installer.jar --installServer
          rm -f installer.jar installer.jar.log
          ls -la

      - name: Fetch FermiumBooter ${{ env.FERMIUM_VERSION }}
        run: ci/fetch-fermium.sh "${{ needs.build.outputs.fermium_file_id }}" "$FERMIUM_VERSION" smoke/fermiumbooter.jar

      - uses: actions/download-artifact@v4
        with:
          name: pelt-jar
          path: smoke/dist

      - name: Boot server, /skin reload, stop
        run: ci/smoke.sh smoke/server "$(ls smoke/dist/*.jar | head -1)" smoke/fermiumbooter.jar

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: smoke-logs
          path: |
            smoke/server/console.log
            smoke/server/logs/
            smoke/server/crash-reports/
            smoke/server/config/pelt.cfg
          if-no-files-found: ignore

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [build, smoke]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: pelt-jar
          path: dist
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*.jar
          generate_release_notes: true
          fail_on_unmatched_files: true
